<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241021">
  <meta name="description" content="BRAZYHUB - Sistem Gudang">
  <title>BRAZYHUB | Sistem Gudang</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1b0d18;
      --panel: #2b1727;
      --pink: #ec4899;
      --pink-light: #f9a8d4;
      --text: #fff7fb;
      --muted: #e8c9da;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body { overflow: hidden; }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #fff5f8;
      z-index: 1;
    }
    #loader {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(236,72,153,.22), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(124,58,237,.13), transparent 35%),
        var(--bg);
      transition: opacity .28s ease, visibility .28s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-card {
      width: min(100%, 390px);
      padding: 32px 26px;
      text-align: center;
      border: 1px solid rgba(249,168,212,.2);
      border-radius: 24px;
      background: rgba(43,23,39,.88);
      box-shadow: 0 24px 70px rgba(0,0,0,.25);
    }
    .logo {
      width: 84px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
      filter: drop-shadow(0 0 16px rgba(244,63,130,.55));
    }
    .brand { margin: 0; color: var(--pink-light); font-size: 22px; font-weight: 850; letter-spacing: 1.4px; }
    .subtitle { margin: 7px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .spinner {
      width: 86px; height: 44px; margin: 0 auto 14px;
    }
    .spinner svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .spinner .track { fill: none; stroke: rgba(249,168,212,.18); stroke-width: 6; }
    .spinner .runner {
      fill: none; stroke: var(--pink); stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 30 70; stroke-dashoffset: 0;
      filter: drop-shadow(0 0 5px rgba(236,72,153,.55));
      animation: infinity-run 2.4s linear infinite;
    }
    @keyframes infinity-run { to { stroke-dashoffset: -100; } }
    .loading-text { color: #fbcfe8; font-size: 13px; }
    .help { display: none; margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .help.show { display: block; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
    .actions[hidden] { display: none; }
    .actions a, .actions button {
      min-height: 42px; padding: 11px 15px; border-radius: 11px;
      font: inherit; font-size: 12px; font-weight: 750; text-decoration: none; cursor: pointer;
    }
    .primary { border: 0; background: linear-gradient(105deg,#f472b6,#db2777); color: #fff; }
    .secondary { border: 1px solid rgba(249,168,212,.25); background: transparent; color: var(--pink-light); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .loader-card { padding: 27px 20px; }
      .brand { font-size: 20px; }
      .actions { flex-direction: column; }
      .actions a, .actions button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>

      var frame = document.getElementById('appFrame');
      var spinner = document.getElementById('spinner');
      var loadingText = document.getElementById('loadingText');
      var helpText = document.getElementById('helpText');
      var actions = document.getElementById('actions');
      var retryButton = document.getElementById('retryButton');
      var timeoutId;

      function hideLoader() {
        loader.classList.add('hide');
        window.setTimeout(function () {
          loader.style.display = 'none';
        }, 320);
        if (timeoutId) window.clearTimeout(timeoutId);
      }

      function showHelp() {
        spinner.style.display = 'none';
        loadingText.textContent = 'Aplikasi belum selesai dimuat.';
        helpText.classList.add('show');
        actions.hidden = false;
      }

      function startTimeout() {
        if (timeoutId) window.clearTimeout(timeoutId);
        timeoutId = window.setTimeout(showHelp, 12000);
      }

      frame.addEventListener('load', hideLoader);
      retryButton.addEventListener('click', function () {
        loader.style.display = 'flex';
        loader.classList.remove('hide');
        spinner.style.display = 'block';
        loadingText.textContent = 'Menghubungkan kembali...';
        helpText.classList.remove('show');
        actions.hidden = true;
        frame.src = frame.src;
        startTimeout();
      });

      startTimeout();
    })();
  </script>
</body>
</html>
